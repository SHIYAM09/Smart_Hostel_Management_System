name: Smart Hostel System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    name: Build & Test React SPA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: smart-hostel-safety-platform/package-lock.json

      - name: Install Dependencies
        run: |
          cd smart-hostel-safety-platform
          npm ci

      - name: Production Build
        run: |
          cd smart-hostel-safety-platform
          npm run build

  build-backend-auth:
    name: Build Authentication Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Auth Service
        run: |
          cd "Two Services/authentication-service"
          mvn clean package -DskipTests

  build-backend-authz:
    name: Build Authorization Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Authz Service
        run: |
          cd "Two Services/authorization-service"
          mvn clean package -DskipTests

  docker-build:
    name: Build Docker Images
    needs: [build-frontend, build-backend-auth, build-backend-authz]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Compose Stack
        run: |
          docker-compose config
