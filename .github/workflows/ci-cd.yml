name: Smart Hostel System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    name: Build & Test React SPA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd smart-hostel-safety-platform
          npm install

      - name: Production Build
        run: |
          cd smart-hostel-safety-platform
          npm run build

  build-backend-auth:
    name: Build Authentication Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'Two Services/authentication-service/pom.xml'

      - name: Build Auth Service
        run: |
          cd "Two Services/authentication-service"
          mvn clean package -DskipTests

  build-backend-authz:
    name: Build Authorization Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'Two Services/authorization-service/pom.xml'

      - name: Build Authz Service
        run: |
          cd "Two Services/authorization-service"
          mvn clean package -DskipTests

  docker-build:
    name: Build Docker Images
    needs: [build-frontend, build-backend-auth, build-backend-authz]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          docker compose config

