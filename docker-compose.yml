version: '3.8'

services:
  # Oracle XE Database
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: smarthostel-oracle
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=swathi_02
      - APP_USER=smarthostel
      - APP_USER_PASSWORD=swathi_02
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - smarthostel-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10

  # MongoDB Document Database
  mongo-db:
    image: mongo:latest
    container_name: smarthostel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - smarthostel-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentication Service (Port 8081)
  authentication-service:
    build:
      context: ./Two Services/authentication-service
      dockerfile: Dockerfile
    container_name: smarthostel-auth-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=swathi_02
      - SPRING_DATA_MONGODB_URI=mongodb://mongo-db:27017/smarthostel_auth
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      oracle-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    networks:
      - smarthostel-network

  # Authorization & Hostel Service (Port 8082)
  authorization-service:
    build:
      context: ./Two Services/authorization-service
      dockerfile: Dockerfile
    container_name: smarthostel-authz-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=swathi_02
      - SPRING_DATA_MONGODB_URI=mongodb://mongo-db:27017/smarthostel_authz
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      oracle-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    networks:
      - smarthostel-network

  # React Frontend (Nginx Reverse Proxy - Port 80)
  frontend-web:
    build:
      context: ./smart-hostel-safety-platform
      dockerfile: Dockerfile
    container_name: smarthostel-frontend
    ports:
      - "80:80"
    depends_on:
      - authentication-service
      - authorization-service
    networks:
      - smarthostel-network

networks:
  smarthostel-network:
    driver: bridge

volumes:
  oracle-data:
  mongo-data:
